        '200':
          description: Preferences
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationPreference' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
  /me/notification-preferences/{eventType}:
    put:
      tags: [Notifications]
      operationId: setMyNotificationPreference
      summary: Set one effective in-app notification preference
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NotificationAudience'
        - name: eventType
          in: path
          required: true
          schema: { $ref: '#/components/schemas/NotificationEventType' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        '200': { description: Updated preference, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreference' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Too many notification mutations, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { $ref: '#/components/responses/ServiceUnavailableError' }
