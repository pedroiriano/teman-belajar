openapi: 3.1.0
info:
  title: Teman Belajar API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Canonical API contract for Teman Belajar, an Enterprise Digital Learning Experience Platform (LXP + LMS).
servers:
  - url: /api/v1
tags:
  - name: System
    description: System operations
  - name: Integration Health
    description: Portal Administrator-only read-only dependency health aggregation
  - name: Platform Configuration
    description: Typed non-secret presentation configuration and version lifecycle
  - name: News
    description: News operations
  - name: Announcements
    description: Announcements operations
  - name: Knowledge
    description: Knowledge operations
  - name: Drafts
    description: Owner-isolated Admin authoring draft operations
  - name: FAQ
    description: FAQ operations
  - name: Learning
    description: Learning operations
  - name: Training Programs
    description: Portal-owned program composition with Moodle-authoritative learning state
  - name: Microlearning
    description: Portal-owned editorial learning activities with lightweight non-Moodle progress
  - name: Learning Paths
    description: Versioned Portal composition with source-owned progress and provenance
  - name: Webinars
    description: Moodle mod_zoom-authoritative live learning operations
  - name: Me
    description: Me operations
  - name: Engagement
    description: Learner engagement operations owned by the Portal
  - name: Admin
    description: Admin operations
  - name: Media
    description: Media operations
  - name: Notifications
    description: User-partitioned in-app notification operations
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      summary: get Health
  /news:
    get:
      tags:
        - News
      operationId: listNews
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: kind
          in: query
          required: false
          schema:
            type: string
            default: all
            enum: [all, image, document]
      responses:
        '200':
          description: Published news
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsList'
        '422':
          $ref: '#/components/responses/ValidationError'
      security: []
      summary: list News
  /news/{slug}:
    get:
      tags:
        - News
      operationId: getNews
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published news detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/News'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      summary: get News
  /announcements:
    get:
      tags:
        - Announcements
      operationId: listAnnouncements
      responses:
        '200':
          description: Active published announcements
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Announcement'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      summary: list Announcements
  /knowledge:
    get:
      tags:
        - Knowledge
      operationId: listKnowledge
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema:
            type: string
        - name: node
          in: query
          description: Filter published articles by their active primary hierarchy node.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published knowledge articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeList'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      summary: list Knowledge
  /knowledge/tree:
    get:
      tags: [Knowledge]
      operationId: getPublicKnowledgeTree
      summary: get active public Knowledge hierarchy
      security: []
      responses:
        '200':
          description: Deterministically ordered active Knowledge tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeTreeResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /knowledge/{slug}:
    get:
      tags:
        - Knowledge
      operationId: getKnowledge
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeArticle'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      summary: get Knowledge
  /faqs:
    get:
      tags:
        - FAQ
      operationId: listFaqs
      parameters:
        - name: q
          in: query
          description: Optional question or answer search text
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: FAQ list
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FaqPublicCategory' }
                  total: { type: integer, minimum: 0 }
        '422': { $ref: '#/components/responses/ValidationError' }
      security: []
      summary: List active categories and published FAQ items only
  /admin/integration-health:
    get:
      tags: [Admin, Integration Health]
      operationId: getIntegrationHealth
      summary: Read one sanitized snapshot of fixed allowlisted dependencies
      description: Portal Administrator only. Probe targets are server-configured; query parameters and operational controls are rejected.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sanitized integration health snapshot
          headers:
            X-Request-ID:
              description: Sanitized or generated correlation identifier
              schema: { type: string, maxLength: 64 }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationHealthSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/audit-events:
    get:
      tags: [Admin, Audit]
      operationId: listAuditEvents
      summary: Search sanitized immutable audit records with cursor pagination
      description: Portal Administrator only. Exact-match filters are bounded and every access attempt is audited.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: actor, in: query, schema: { type: string, format: uuid } }
        - { name: event, in: query, schema: { type: string, maxLength: 100 } }
        - { name: module, in: query, schema: { type: string, maxLength: 100 } }
        - { name: target_type, in: query, schema: { type: string, maxLength: 100 } }
        - { name: target_id, in: query, schema: { type: string, maxLength: 255 } }
        - { name: result, in: query, schema: { type: string, maxLength: 50 } }
        - { name: correlation_id, in: query, schema: { type: string, maxLength: 64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 256 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Cursor-paginated sanitized audit events
          content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/audit-events/export:
    get:
      tags: [Admin, Audit]
      operationId: exportAuditEvents
      summary: Export at most 10000 sanitized audit records as CSV
      description: Portal Administrator only. From/to dates are required, the maximum range is 31 days, and every export is audited.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: actor, in: query, schema: { type: string, format: uuid } }
        - { name: event, in: query, schema: { type: string, maxLength: 100 } }
        - { name: module, in: query, schema: { type: string, maxLength: 100 } }
        - { name: target_type, in: query, schema: { type: string, maxLength: 100 } }
        - { name: target_id, in: query, schema: { type: string, maxLength: 255 } }
        - { name: result, in: query, schema: { type: string, maxLength: 50 } }
        - { name: correlation_id, in: query, schema: { type: string, maxLength: 64 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Sanitized CSV export
          content: { text/csv: { schema: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/audit-events/{id}:
    get:
      tags: [Admin, Audit]
      operationId: getAuditEvent
      summary: Read one sanitized audit record
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sanitized audit event detail
          content: { application/json: { schema: { $ref: '#/components/schemas/AuditEvent' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /training-programs:
    get:
      tags: [Training Programs]
      operationId: listTrainingPrograms
      summary: List published training programs
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated published training programs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingProgramList' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /training-programs/{slug}:
    get:
      tags: [Training Programs]
      operationId: getTrainingProgram
      summary: Get a published program with live Moodle course composition
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } }
      responses:
        '200':
          description: Program detail; provenance reports any partial Moodle degradation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingProgramDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /learning/me/training-programs/{slug}:
    get:
      tags: [Learning, Training Programs]
      operationId: getMyTrainingProgramProgress
      summary: Aggregate current learner progress from Moodle without assuming access
      security:
        - bearerAuth: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Moodle-provenanced learner progress or a safe degraded state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingProgramProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/training-programs:
    get:
      tags: [Admin, Training Programs]
      operationId: listAdminTrainingPrograms
      summary: List training programs across workflow states
      security:
        - oidc: [content:read]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [all, draft, in_review, approved, published, archived] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Admin program list, content: { application/json: { schema: { $ref: '#/components/schemas/TrainingProgramList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Admin, Training Programs]
      operationId: createTrainingProgram
      summary: Create a draft from validated visible Moodle course IDs
      security:
        - oidc: [content:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingProgramWrite' }
      responses:
        '201': { description: Draft created, content: { application/json: { schema: { $ref: '#/components/schemas/TrainingProgram' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /admin/training-programs/course-options:
    get:
      tags: [Admin, Training Programs]
      operationId: listTrainingProgramCourseOptions
      summary: List visible Moodle courses available for composition
      security:
        - oidc: [content:read]
      responses:
        '200':
          description: Live Moodle course options
          content:
            application/json:
              schema:
                type: object
                required: [data, provenance]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LearningCourse' } }
                  provenance: { $ref: '#/components/schemas/TrainingProvenance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /admin/training-programs/{id}:
    get:
      tags: [Admin, Training Programs]
      operationId: getAdminTrainingProgram
      summary: Get one training program for composition review
      security:
        - oidc: [content:read]
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200': { description: Program detail, content: { application/json: { schema: { $ref: '#/components/schemas/TrainingProgram' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin, Training Programs]
      operationId: updateTrainingProgram
      summary: Update an editable draft with optimistic locking
      security:
        - oidc: [content:write]
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingProgramWrite' }
      responses:
        '200': { description: Program updated, content: { application/json: { schema: { $ref: '#/components/schemas/TrainingProgram' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /admin/training-programs/{id}/transition:
    post:
      tags: [Admin, Training Programs]
      operationId: transitionTrainingProgram
      summary: Apply a role-gated workflow transition and revalidate Moodle on publish
      security:
        - oidc: [content:write]
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/TrainingProgramStatus' }
      responses:
        '200': { description: Program transitioned, content: { application/json: { schema: { $ref: '#/components/schemas/TrainingProgram' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /learning-paths:
    get:
      tags: [Learning Paths]
      operationId: listLearningPaths
      summary: List published learning path versions
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Published learning path catalogue, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPathList' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /learning-paths/{slug}:
    get:
      tags: [Learning Paths]
      operationId: getLearningPath
      summary: Get the immutable currently published learning path version
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } }
      responses:
        '200': { description: Published learning path, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPath' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /learning/me/learning-paths/{slug}:
    get:
      tags: [Learning, Learning Paths]
      operationId: getMyLearningPathProgress
      summary: Bind the learner to a stable published version and aggregate source-owned progress
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Provenance-aware learner journey, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPathProgress' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/learning-paths:
    get:
      tags: [Admin, Learning Paths]
      operationId: listAdminLearningPaths
      summary: List latest learning path versions across workflow states
      security: [{ oidc: [content:read] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [all, draft, in_review, approved, published, archived] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Admin learning path list, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPathList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Admin, Learning Paths]
      operationId: createLearningPath
      summary: Create a validated draft learning path
      security: [{ oidc: [content:write] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPathWrite' } } } }
      responses:
        '201': { description: Draft created, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPath' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/learning-paths/options:
    get:
      tags: [Admin, Learning Paths]
      operationId: listLearningPathOptions
      summary: List allowlisted published sources and bounded provenance
      security: [{ oidc: [content:read] }]
      responses:
        '200': { description: Composition options, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPathOptions' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/learning-paths/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Admin, Learning Paths]
      operationId: getAdminLearningPath
      summary: Get the latest Admin learning path version
      security: [{ oidc: [content:read] }]
      responses:
        '200': { description: Latest editable or published version, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPath' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin, Learning Paths]
      operationId: updateLearningPath
      summary: Update only the latest draft using optimistic locking
      security: [{ oidc: [content:write] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPathWrite' } } } }
      responses:
        '200': { description: Draft updated, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPath' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/learning-paths/{id}/transition:
    post:
      tags: [Admin, Learning Paths]
      operationId: transitionLearningPath
      summary: Apply a role-gated transition and revalidate required sources on publish
      security: [{ oidc: [content:write] }]
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [status], properties: { status: { $ref: '#/components/schemas/LearningPathStatus' } } } } } }
      responses:
        '200': { description: Version transitioned, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPath' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /admin/learning-paths/{id}/revisions:
    post:
      tags: [Admin, Learning Paths]
      operationId: createLearningPathRevision
      summary: Create a new draft while preserving the immutable published version
      security: [{ oidc: [content:write] }]
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [expected_row_version], properties: { expected_row_version: { type: integer, format: int64, minimum: 1 } } } } } }
      responses:
        '201': { description: New draft version, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPath' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /microlearning:
    get:
      tags: [Microlearning]
      operationId: listMicrolearning
      summary: List published Portal-owned microlearning
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: format, in: query, schema: { $ref: '#/components/schemas/MicrolearningFormat' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: Published microlearning catalogue, content: { application/json: { schema: { $ref: '#/components/schemas/MicrolearningList' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /microlearning/{slug}:
    get:
      tags: [Microlearning]
      operationId: getMicrolearning
      summary: Get one published editorial microlearning item and published related content
      security: []
      parameters:
