components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://id.example.invalid/realms/teman-belajar/.well-known/openid-configuration
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque retry key retained by Moodle for exactly-once mutation semantics
      schema: { type: string, minLength: 8, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$' }
    NotificationAudience:
      name: audience
      in: query
      required: true
      description: UI audience fixed by the trusted Portal/Admin BFF; Admin requires an existing Admin role.
      schema: { type: string, enum: [portal, admin] }
    DiscoveryContentType:
      name: contentType
      in: path
      required: true
      schema: { type: string, enum: [news, announcement, knowledge] }
    DiscoveryContentId:
      name: contentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    EngagementTargetType:
      name: targetType
      in: path
      required: true
      schema:
        type: string
        enum: [knowledge]
    BookmarkTargetType:
      name: targetType
      in: path
      required: true
      schema:
        type: string
        enum: [knowledge, microlearning]
    EngagementTargetId:
      name: targetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgeNodeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Insufficient permission
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConflictError:
      description: Optimistic version conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DependencyUnavailable:
      description: Required learning dependency is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailableError:
      description: Service Unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PlatformNavigationItem:
      type: object
      additionalProperties: false
      required: [label, href, visible]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 180 }
        href: { type: string, minLength: 1, maxLength: 500, description: Internal path or HTTPS URL on the server-side host allowlist }
        visible: { type: boolean }
    PlatformConfiguration:
      type: object
      additionalProperties: false
      required: [identity, homepage, navigation, banner, footer, contact, seo, features]
      properties:
        identity:
          type: object
          additionalProperties: false
          required: [tagline]
          properties: { tagline: { type: string, maxLength: 120 }, logo_media_id: { type: string, format: uuid } }
        homepage:
          type: object
          additionalProperties: false
          required: [sections]
          properties:
            sections:
              type: array
              minItems: 1
              maxItems: 9
              items:
                type: object
                additionalProperties: false
                required: [key, visible, order]
                properties: { key: { type: string, enum: [hero, trust, learning_paths, topics, knowledge, media, stats, faq, cta] }, visible: { type: boolean }, order: { type: integer, minimum: 1, maximum: 9 } }
        navigation: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/PlatformNavigationItem' } }
        banner:
          type: object
          additionalProperties: false
          required: [enabled, title, body]
          properties: { enabled: { type: boolean }, title: { type: string, maxLength: 120 }, body: { type: string, maxLength: 400 }, href: { type: string, maxLength: 500 }, media_id: { type: string, format: uuid } }
        footer:
          type: object
          additionalProperties: false
          required: [summary, links]
          properties: { summary: { type: string, minLength: 1, maxLength: 400 }, links: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/PlatformNavigationItem' } } }
        contact:
          type: object
          additionalProperties: false
          required: [help_label, help_href]
