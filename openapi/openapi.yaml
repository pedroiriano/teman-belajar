openapi: 3.1.0
info:
  title: Teman Belajar API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: Canonical API contract for Teman Belajar, an Enterprise Digital Learning Experience Platform (LXP + LMS).
servers:
  - url: /api/v1
tags:
  - name: System
    description: System operations
  - name: News
    description: News operations
  - name: Announcements
    description: Announcements operations
  - name: Knowledge
    description: Knowledge operations
  - name: FAQ
    description: FAQ operations
  - name: Learning
    description: Learning operations
  - name: Me
    description: Me operations
  - name: Engagement
    description: Learner engagement operations owned by the Portal
  - name: Admin
    description: Admin operations
  - name: Media
    description: Media operations
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      summary: get Health
  /news:
    get:
      tags:
        - News
      operationId: listNews
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Published news
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsList'
        '422':
          $ref: '#/components/responses/ValidationError'
      security: []
      summary: list News
  /news/{slug}:
    get:
      tags:
        - News
      operationId: getNews
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published news detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/News'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      summary: get News
  /announcements:
    get:
      tags:
        - Announcements
      operationId: listAnnouncements
      responses:
        '200':
          description: Active published announcements
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Announcement'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      summary: list Announcements
  /knowledge:
    get:
      tags:
        - Knowledge
      operationId: listKnowledge
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Published knowledge articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeList'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      summary: list Knowledge
  /knowledge/{slug}:
    get:
      tags:
        - Knowledge
      operationId: getKnowledge
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Knowledge article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeArticle'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      summary: get Knowledge
  /faqs:
    get:
      tags:
        - FAQ
      operationId: listFaqs
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: FAQ list
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Faq'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      summary: list Faqs
  /courses:
    get:
      tags:
        - Learning
      operationId: listCourses
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Canonical course catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      security: []
      summary: list Courses
  /courses/{id}:
    get:
      tags:
        - Learning
      operationId: getCourse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
      security: []
      summary: get Course
  /me:
    get:
      tags:
        - Me
      security:
        - oidc:
            - profile
      operationId: getMe
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
      summary: get Me
  /me/dashboard:
    get:
      tags:
        - Me
      security:
        - oidc:
            - profile
      operationId: getMyDashboard
      responses:
        '200':
          description: Aggregated learner dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
      summary: get My Dashboard
  /me/bookmarks:
    get:
      tags:
        - Engagement
      security:
        - oidc:
            - profile
      operationId: listMyBookmarks
      responses:
        '200':
          description: Current learner's active bookmarks
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EngagementItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: list My Bookmarks
  /me/bookmarks/{targetType}/{targetId}:
    parameters:
      - $ref: '#/components/parameters/EngagementTargetType'
      - $ref: '#/components/parameters/EngagementTargetId'
    put:
      tags:
        - Engagement
      security:
        - oidc:
            - profile
      operationId: putMyBookmark
      responses:
        '200':
          description: Bookmark created or already present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: idempotently save a bookmark
    delete:
      tags:
        - Engagement
      security:
        - oidc:
            - profile
      operationId: deleteMyBookmark
      responses:
        '204':
          description: Bookmark is absent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: idempotently delete a bookmark
  /me/ratings/{targetType}/{targetId}:
    parameters:
      - $ref: '#/components/parameters/EngagementTargetType'
      - $ref: '#/components/parameters/EngagementTargetId'
    get:
      tags:
        - Engagement
      security:
        - oidc:
            - profile
      operationId: getMyRating
      responses:
        '200':
          description: Aggregate rating and current learner rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: get my rating and aggregate
    put:
      tags:
        - Engagement
      security:
        - oidc:
            - profile
      operationId: putMyRating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingWrite'
      responses:
        '200':
          description: Rating created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: atomically create or update my rating
    delete:
      tags:
        - Engagement
      security:
        - oidc:
            - profile
      operationId: deleteMyRating
      responses:
        '204':
          description: Rating is absent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: idempotently delete my rating
  /ratings/{targetType}/{targetId}:
    parameters:
      - $ref: '#/components/parameters/EngagementTargetType'
      - $ref: '#/components/parameters/EngagementTargetId'
    get:
      tags:
        - Engagement
      operationId: getRatingSummary
      security: []
      responses:
        '200':
          description: Anonymous aggregate without learner identities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingSummaryPublic'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: get public rating aggregate
  /me/recent-views:
    get:
      tags:
        - Engagement
      security:
        - oidc:
            - profile
      operationId: listMyRecentViews
      responses:
        '200':
          description: Latest 50 unique accessible targets for the current learner
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/EngagementItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: list my bounded recent view history
  /me/recent-views/{targetType}/{targetId}:
    parameters:
      - $ref: '#/components/parameters/EngagementTargetType'
      - $ref: '#/components/parameters/EngagementTargetId'
    put:
      tags:
        - Engagement
      security:
        - oidc:
            - profile
      operationId: putMyRecentView
      responses:
        '200':
          description: Recent view created or atomically incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: record a successful meaningful content view
  /me/recommendations:
    get:
      tags:
        - Engagement
      security:
        - oidc:
            - profile
      operationId: listMyRecommendations
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
        - name: content_type
          in: query
          schema:
            type: string
            enum: [knowledge]
      responses:
        '200':
          description: Deterministically ranked eligible targets
          content:
            application/json:
              schema:
                type: object
                required: [data, personalized]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recommendation'
                  personalized:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
      summary: list deterministic explainable recommendations
  /admin/news:
    get:
      tags:
        - Admin
      security:
        - oidc:
            - content:read
      operationId: listAdminNews
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: All news (admin view)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsList'
        '401':
          $ref: '#/components/responses/Unauthorized'
      summary: list Admin News
    post:
      tags:
        - Admin
      security:
        - oidc:
            - content:write
      operationId: createNews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsCreate'
      responses:
        '201':
          description: Draft news created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/News'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: create News
  /admin/news/{id}:
    put:
      tags:
        - Admin
      security:
        - oidc:
            - content:write
      operationId: updateNewsStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - draft
                    - in_review
                    - approved
                    - published
                    - archived
      responses:
        '200':
          description: Status updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: update News Status
  /admin/announcements:
    get:
      tags:
        - Admin
      security:
        - oidc:
            - content:read
      operationId: listAdminAnnouncements
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: All announcements (admin view)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Announcement'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
      summary: list Admin Announcements
    post:
      tags:
        - Admin
      security:
        - oidc:
            - content:write
      operationId: createAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementCreate'
      responses:
        '201':
          description: Announcement created
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: create Announcement
  /admin/announcements/{id}:
    put:
      tags:
        - Admin
      security:
        - oidc:
            - content:write
      operationId: updateAnnouncementStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - draft
                    - in_review
                    - approved
                    - published
                    - archived
      responses:
        '200':
          description: Status updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: update Announcement Status
  /admin/knowledge:
    get:
      tags:
        - Admin
        - Knowledge
      security:
        - oidc:
            - content:read
      operationId: listAdminKnowledgeArticles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: All knowledge articles, including unpublished workflow states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      summary: list Admin Knowledge Articles
    post:
      tags:
        - Admin
        - Knowledge
      security:
        - oidc:
            - content:write
      operationId: createKnowledgeArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeCreate'
      responses:
        '201':
          description: Article created
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: create Knowledge Article
  /admin/knowledge/{id}:
    get:
      tags:
        - Admin
        - Knowledge
      security:
        - oidc:
            - content:read
      operationId: getAdminKnowledgeArticle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Knowledge article with its current working revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeArticle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: get Admin Knowledge Article
  /admin/knowledge/{id}/revisions:
    post:
      tags:
        - Admin
        - Knowledge
      security:
        - oidc:
            - content:write
      operationId: createKnowledgeRevision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeRevisionCreate'
      responses:
        '201':
          description: Revision created
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: create Knowledge Revision
  /admin/knowledge/{id}/transition:
    post:
      tags:
        - Admin
        - Knowledge
      security:
        - oidc:
            - content:write
      operationId: transitionKnowledgeStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - draft
                    - in_review
                    - approved
                    - published
                    - archived
      responses:
        '200':
          description: Status transitioned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: transition Knowledge Status
  /admin/media:
    get:
      tags:
        - Admin
        - Media
      security:
        - oidc:
            - content:read
      operationId: listAdminMedia
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: All media assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetList'
        '401':
          $ref: '#/components/responses/Unauthorized'
      summary: list Admin Media
    post:
      tags:
        - Admin
        - Media
      security:
        - oidc:
            - content:write
      operationId: createMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                alt_text:
                  type: string
                caption:
                  type: string
      responses:
        '201':
          description: Media uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Payload too large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported media type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: create Media
  /admin/media/{id}:
    get:
      tags:
        - Admin
        - Media
      security:
        - oidc:
            - content:read
      operationId: getAdminMedia
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Media asset detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: get Admin Media
    patch:
      tags:
        - Admin
        - Media
      security:
        - oidc:
            - content:write
      operationId: updateMediaMetadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaMetadataUpdate'
      responses:
        '200':
          description: Metadata updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      summary: update Media Metadata
  /admin/media/{id}/content:
    get:
      tags:
        - Admin
        - Media
      summary: Admin access to media binary content
      description: Returns the binary content of the media asset, bypassing public access checks.
      operationId: getAdminMediaContent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Media binary content
          content:
            application/octet-stream: {}
            image/*: {}
            application/pdf: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /admin/media/{id}/archive:
    post:
      tags:
        - Admin
        - Media
      security:
        - oidc:
            - content:write
      operationId: archiveMedia
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Media archived
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Media still in use
          content:
            application/problem+json:
              schema:
