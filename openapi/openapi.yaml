  /search:
    get:
      operationId: searchPublicContent
      tags:
        - Search
      summary: Search published public content
      description: Searches the derived public index for visible Moodle courses, published microlearning, published knowledge revisions, published news, active announcements, and published indexable FAQs. Raw engine filters are never accepted.
      security: []
      parameters:
        - name: q
          in: query
          description: Trimmed search text
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: content_type
          in: query
          description: Teman Belajar content type allowlist
          required: false
          schema:
            type: string
            enum:
              - course
              - knowledge
              - news
              - announcement
              - faq
              - microlearning
        - name: category_id
          in: query
          description: Filter by canonical category UUID
          required: false
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          description: Filter by an exact public tag
          required: false
          schema:
            type: string
            maxLength: 64
            pattern: '^[\p{L}\p{N} ._-]+$'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: relevance
            enum:
              - relevance
              - newest
              - oldest
      responses:
        '200':
          description: Public search results
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - content_type
                        - title
                        - snippet
                        - url
                        - tags
                      properties:
                        id:
                          type: string
                        content_type:
                          type: string
                          enum:
                            - course
                            - knowledge
                            - news
                            - announcement
                            - faq
                            - microlearning
                        title:
                          type: string
                        snippet:
                          type: string
                        url:
                          type: string
                        category:
                          type: string
                        hierarchy_path:
                          type: array
                          items: { type: string }
                        tags:
                          type: array
                          items:
                            type: string
                        published_at:
                          type: string
                          format: date-time
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
