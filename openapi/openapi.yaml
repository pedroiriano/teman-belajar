        data: { type: array, items: { $ref: '#/components/schemas/LearningPathOption' } }
        provenance: { type: object, additionalProperties: { type: string, enum: [fresh, degraded, blocked_task015] } }
    LearningPathItemProgress:
      type: object
      required: [item_id, key, state, progress, locked]
      properties:
        item_id: { type: string, format: uuid }
        key: { type: string }
        state: { type: string, enum: [not_started, available, in_progress, completed, locked, unavailable] }
        progress: { type: number, minimum: 0, maximum: 100 }
        locked: { type: boolean }
        detail: { type: string, enum: [moodle_progress_unavailable, knowledge_activity_unavailable, microlearning_progress_unavailable, webinar_unavailable, source_unavailable] }
    LearningPathProgress:
      type: object
      required: [path, bound_version, items, progress_percent, completed_items, total_items, provenance]
      properties:
        path: { $ref: '#/components/schemas/LearningPath' }
        bound_version: { type: integer, minimum: 1 }
        items: { type: array, items: { $ref: '#/components/schemas/LearningPathItemProgress' } }
        progress_percent: { type: number, minimum: 0, maximum: 100 }
        completed_items: { type: integer, minimum: 0 }
        total_items: { type: integer, minimum: 1 }
        next_step: { $ref: '#/components/schemas/LearningPathItem' }
        provenance: { type: object, additionalProperties: { type: string, enum: [fresh, degraded, blocked_task015] } }
    MicrolearningStatus:
      type: string
      enum: [draft, in_review, approved, published, archived]
    MicrolearningFormat:
      type: string
      enum: [article, video, quick]
    MicrolearningRelated:
      type: object
      required: [id, slug, title, summary, format, duration_minutes]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        format: { $ref: '#/components/schemas/MicrolearningFormat' }
        duration_minutes: { type: integer, minimum: 3, maximum: 15 }
    MicrolearningItem:
      type: object
      required: [id, slug, title, summary, body, format, duration_minutes, status, version, indexable, created_at, updated_at, related]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        title: { type: string, minLength: 3, maxLength: 200 }
        summary: { type: string, minLength: 10, maxLength: 500 }
        body: { type: string, minLength: 20, maxLength: 20000 }
        format: { $ref: '#/components/schemas/MicrolearningFormat' }
        duration_minutes: { type: integer, minimum: 3, maximum: 15 }
        video_url: { type: string, format: uri, pattern: '^https://' }
        featured_media_id: { type: string, format: uuid, description: Active image Media Asset ID; storage internals are never returned }
        featured_media_url: { type: string, pattern: '^/media/' }
        status: { $ref: '#/components/schemas/MicrolearningStatus' }
        version: { type: integer, minimum: 1 }
        seo_title: { type: string, maxLength: 70 }
        seo_description: { type: string, maxLength: 160 }
        indexable: { type: boolean }
        published_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        related: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/MicrolearningRelated' } }
    MicrolearningWrite:
      type: object
      additionalProperties: false
      required: [slug, title, summary, body, format, duration_minutes, video_url, featured_media_id, related_ids, seo_title, seo_description, indexable]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 160 }
        title: { type: string, minLength: 3, maxLength: 200 }
        summary: { type: string, minLength: 10, maxLength: 500 }
        body: { type: string, minLength: 20, maxLength: 20000 }
        format: { $ref: '#/components/schemas/MicrolearningFormat' }
        duration_minutes: { type: integer, minimum: 3, maximum: 15 }
        video_url: { type: string, maxLength: 2048, description: Required HTTPS URL for video format; empty otherwise }
        featured_media_id: { type: string, description: Empty or active image Media Asset UUID }
        related_ids: { type: array, maxItems: 8, uniqueItems: true, items: { type: string, format: uuid } }
        seo_title: { type: string, maxLength: 70 }
        seo_description: { type: string, maxLength: 160 }
        indexable: { type: boolean }
        expected_version: { type: integer, minimum: 1 }
    MicrolearningList:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MicrolearningItem' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    MicrolearningProgressWrite:
      type: object
      additionalProperties: false
      required: [progress_percent, position_seconds]
      properties:
        progress_percent: { type: number, minimum: 0, maximum: 100 }
        position_seconds: { type: integer, minimum: 0 }
    MicrolearningProgress:
      type: object
      required: [item_id, progress_percent, position_seconds, updated_at, source, state, formal_completion]
      properties:
        item_id: { type: string, format: uuid }
        progress_percent: { type: number, minimum: 0, maximum: 100 }
        position_seconds: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
        source: { type: string, enum: [portal] }
        state: { type: string, enum: [editorial_activity] }
        formal_completion: { type: boolean, const: false, description: "Explicitly not Moodle completion, grading, or certification" }
    LearningUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
    EnrolledCourse:
      type: object
      required:
        - id
        - short_name
        - full_name
        - completed
      properties:
        id:
          type: integer
        short_name:
          type: string
        full_name:
          type: string
        enrolled_at:
          type:
            - integer
            - 'null'
        last_access:
          type:
            - integer
            - 'null'
        progress:
          type: number
          format: float
        completed:
          type: boolean
    CourseCompletion:
      type: object
      properties:
        course_id:
          type: integer
        completed:
          type: boolean
        status:
          type: string
    GradeItem:
      type: object
      properties:
        id:
          type: integer
        item_name:
          type: string
        grade:
          type: number
        grade_min:
          type: number
        grade_max:
          type: number
        grade_formatted:
          type: string
        feedback:
          type: string
        hidden:
          type: boolean

    StatisticsResponse:
      type: object
      required: [api, page_views, learning, sso, search, content, engagement, engagement_scope, period_unique_visitors, sources]
      properties:
        api:
          type: object
          required: [request_rate, status_2xx, status_3xx, status_4xx, status_5xx, error_rate, p50_latency, p95_latency, p99_latency, availability, source]
          properties:
            request_rate:
              $ref: '#/components/schemas/PromValue'
            error_rate:
              $ref: '#/components/schemas/PromValue'
            p50_latency:
              $ref: '#/components/schemas/PromValue'
            p95_latency:
              $ref: '#/components/schemas/PromValue'
            p99_latency:
              $ref: '#/components/schemas/PromValue'
            status_2xx:
              $ref: '#/components/schemas/PromValue'
            status_3xx:
              $ref: '#/components/schemas/PromValue'
            status_4xx:
              $ref: '#/components/schemas/PromValue'
            status_5xx:
              $ref: '#/components/schemas/PromValue'
            availability:
              $ref: '#/components/schemas/PromValue'
            source:
              $ref: '#/components/schemas/AnalyticsSourceState'
        page_views:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              path:
                type: string
              views:
                type: integer
              unique_visitors:
                type: integer
        learning:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              active_learners:
                type: integer
              learning_starts:
                type: integer
              eligible_enrolments:
                type: integer
              completions:
                type: integer
              completion_rate:
                type: number
              top_courses:
                type: array
                items:
                  type: object
                  properties:
                    course_id:
                      type: integer
                    course_name:
                      type: string
                    accesses:
                      type: integer
                    unique_learners:
                      type: integer
        learning_period:
          oneOf:
            - $ref: '#/components/schemas/PeriodLearningStats'
            - type: 'null'
        sso:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              successful_logins:
                type: integer
              failed_logins:
                type: integer

        search:
          type: array
          items:
            $ref: '#/components/schemas/SearchDaily'
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentDaily'
        engagement:
          oneOf:
            - $ref: '#/components/schemas/EngagementStats'
            - type: 'null'
        engagement_scope:
          type: string
          enum: [all_time_current_state]
        period_unique_visitors:
          $ref: '#/components/schemas/PeriodUniqueVisitors'
        sources:
          type: object
          required: [analytics, moodle, prometheus]
          properties:
            analytics:
              $ref: '#/components/schemas/AnalyticsSourceState'
            moodle:
              $ref: '#/components/schemas/AnalyticsSourceState'
            prometheus:
              $ref: '#/components/schemas/AnalyticsSourceState'
    PromValue:
      type: object
      required: [value, available, observed_at]
      properties:
        value:
          type: [number, 'null']
        available:
          type: boolean
        reason:
          type: string
          enum: [no_data, unavailable, invalid_value, invalid_response, invalid_request]
        observed_at:
          type: [string, 'null']
          format: date-time
    AnalyticsSourceState:
      type: object
      required: [status, observed_at]
      properties:
        status:
          type: string
          enum: [fresh, stale, unavailable, empty]
        observed_at:
          type: [string, 'null']
          format: date-time
        reason:
          type: string
    PeriodUniqueVisitors:
      type: object
      required: [value, available]
      properties:
        value:
          type: [integer, 'null']
        available:
          type: boolean
        reason:
          type: string
          enum: [retention_limit, analytics_query_failed]
    PeriodLearningStats:
      type: object
      required: [active_learners, learning_starts, eligible_enrolments, completions, completion_rate, top_courses]
      properties:
        active_learners:
          type: integer
          minimum: 0
        learning_starts:
          type: integer
          minimum: 0
        eligible_enrolments:
          type: integer
          minimum: 0
        completions:
          type: integer
          minimum: 0
        completion_rate:
          type: number
          minimum: 0
          maximum: 100
        top_courses:
          type: array
          items:
            type: object
            required: [course_id, course_name, accesses, unique_learners]
            properties:
              course_id:
                type: integer
              course_name:
                type: string
              accesses:
                type: integer
              unique_learners:
                type: integer
    SearchDaily:
      type: object
      required: [date, total_searches, zero_results, result_clicks]
      properties:
        date:
          type: string
          format: date
        total_searches:
          type: integer
        zero_results:
          type: integer
        result_clicks:
          type: integer
    ContentDaily:
      type: object
      required: [date, content_type, target_id, views, unique_visitors]
      properties:
        date:
          type: string
          format: date
        content_type:
          type: string
          enum: [knowledge, news, announcement]
        target_id:
          type: string
        views:
          type: integer
        unique_visitors:
          type: integer
    EngagementStats:
      type: object
      required: [bookmarks, ratings, avg_rating]
      properties:
        bookmarks:
          type: integer
        ratings:
          type: integer
        avg_rating:
          type: number
    AnalyticsEventRequest:
      type: object
      required: [event_type, url]
      additionalProperties: false
      properties:
        event_type:
          type: string
        url:
          type: string
          maxLength: 2048
        referrer:
          type: string
          maxLength: 2048
        metadata:
          type: object
