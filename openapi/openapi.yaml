    parameters:
      - name: draftKey
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin, Drafts]
      summary: get an unexpired draft owned by access-token sub
      operationId: getFormDraft
      security:
        - oidc: [content:write]
      responses:
        '200':
          description: Owned draft
          headers:
            Cache-Control: { schema: { type: string }, description: Always no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin, Drafts]
      summary: create or optimistically update an owned draft
      operationId: saveFormDraft
      security:
        - oidc: [content:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormDraftWrite' }
      responses:
        '200':
          description: Draft saved; first save returns revision 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A newer server revision or edit draft exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/FormDraftConflictProblem' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin, Drafts]
      summary: discard or finalize an owned draft
      operationId: deleteFormDraft
      security:
        - oidc: [content:write]
      parameters:
        - name: reason
          in: query
          required: true
          schema: { type: string, enum: [discarded, finalized] }
      responses:
        '204': { description: Draft deleted and lifecycle event audited }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
