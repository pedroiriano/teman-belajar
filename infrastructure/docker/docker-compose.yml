name: teman-belajar

services:
  portal-db:
    image: postgres:15.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TB_PORTAL_DB_NAME:?Set TB_PORTAL_DB_NAME in infrastructure/docker/.env}
      POSTGRES_USER: ${TB_PORTAL_DB_USER:?Set TB_PORTAL_DB_USER in infrastructure/docker/.env}
      POSTGRES_PASSWORD: ${TB_PORTAL_DB_PASSWORD:?Set TB_PORTAL_DB_PASSWORD in infrastructure/docker/.env}
      KEYCLOAK_DB_NAME: ${TB_KEYCLOAK_DB_NAME:?Set TB_KEYCLOAK_DB_NAME in infrastructure/docker/.env}
      KEYCLOAK_DB_USER: ${TB_KEYCLOAK_DB_USER:?Set TB_KEYCLOAK_DB_USER in infrastructure/docker/.env}
      KEYCLOAK_DB_PASSWORD: ${TB_KEYCLOAK_DB_PASSWORD:?Set TB_KEYCLOAK_DB_PASSWORD in infrastructure/docker/.env}
    ports:
      - "${TB_BIND_ADDRESS:?Set TB_BIND_ADDRESS in infrastructure/docker/.env}:${TB_PORTAL_DB_PORT:?Set TB_PORTAL_DB_PORT in infrastructure/docker/.env}:5432"
    volumes:
      - portal-db-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-create-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      com.teman-belajar.component: portal-db
      com.teman-belajar.data-owner: portal

  moodle-db:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TB_MOODLE_DB_NAME:?Set TB_MOODLE_DB_NAME in infrastructure/docker/.env}
      POSTGRES_USER: ${TB_MOODLE_DB_USER:?Set TB_MOODLE_DB_USER in infrastructure/docker/.env}
      POSTGRES_PASSWORD: ${TB_MOODLE_DB_PASSWORD:?Set TB_MOODLE_DB_PASSWORD in infrastructure/docker/.env}
    ports:
      - "${TB_BIND_ADDRESS:?Set TB_BIND_ADDRESS in infrastructure/docker/.env}:${TB_MOODLE_DB_PORT:?Set TB_MOODLE_DB_PORT in infrastructure/docker/.env}:5432"
    volumes:
      - moodle-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      com.teman-belajar.component: moodle-db
      com.teman-belajar.data-owner: moodle

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${TB_REDIS_PASSWORD:?Set TB_REDIS_PASSWORD in infrastructure/docker/.env}
    environment:
      REDIS_PASSWORD: ${TB_REDIS_PASSWORD:?Set TB_REDIS_PASSWORD in infrastructure/docker/.env}
    ports:
      - "${TB_BIND_ADDRESS:?Set TB_BIND_ADDRESS in infrastructure/docker/.env}:${TB_REDIS_PORT:?Set TB_REDIS_PORT in infrastructure/docker/.env}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      com.teman-belajar.component: redis

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: portal-db
      KC_DB_URL_DATABASE: ${TB_KEYCLOAK_DB_NAME:?Set TB_KEYCLOAK_DB_NAME in infrastructure/docker/.env}
      KC_DB_USERNAME: ${TB_KEYCLOAK_DB_USER:?Set TB_KEYCLOAK_DB_USER in infrastructure/docker/.env}
      KC_DB_PASSWORD: ${TB_KEYCLOAK_DB_PASSWORD:?Set TB_KEYCLOAK_DB_PASSWORD in infrastructure/docker/.env}
      KEYCLOAK_ADMIN: ${TB_KEYCLOAK_ADMIN_USER:?Set TB_KEYCLOAK_ADMIN_USER in infrastructure/docker/.env}
      KEYCLOAK_ADMIN_PASSWORD: ${TB_KEYCLOAK_ADMIN_PASSWORD:?Set TB_KEYCLOAK_ADMIN_PASSWORD in infrastructure/docker/.env}
      PORTAL_WEB_URL: ${TB_WEB_URL:?Set TB_WEB_URL in infrastructure/docker/.env}
      ADMIN_WEB_URL: ${TB_ADMIN_URL:?Set TB_ADMIN_URL in infrastructure/docker/.env}
      MOODLE_BASE_URL: ${TB_MOODLE_URL:?Set TB_MOODLE_URL in infrastructure/docker/.env}
      KEYCLOAK_WEB_CLIENT_SECRET: ${TB_KEYCLOAK_WEB_CLIENT_SECRET:?Set TB_KEYCLOAK_WEB_CLIENT_SECRET in infrastructure/docker/.env}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${TB_KEYCLOAK_ADMIN_CLIENT_SECRET:?Set TB_KEYCLOAK_ADMIN_CLIENT_SECRET in infrastructure/docker/.env}
      KEYCLOAK_MOODLE_CLIENT_SECRET: ${TB_KEYCLOAK_MOODLE_CLIENT_SECRET:?Set TB_KEYCLOAK_MOODLE_CLIENT_SECRET in infrastructure/docker/.env}
      KEYCLOAK_SEED_ADMIN_PASSWORD: ${TB_KEYCLOAK_SEED_ADMIN_PASSWORD:?Set TB_KEYCLOAK_SEED_ADMIN_PASSWORD in infrastructure/docker/.env}
      KEYCLOAK_SEED_LEARNER_PASSWORD: ${TB_KEYCLOAK_SEED_LEARNER_PASSWORD:?Set TB_KEYCLOAK_SEED_LEARNER_PASSWORD in infrastructure/docker/.env}
    ports:
      - "${TB_BIND_ADDRESS:?Set TB_BIND_ADDRESS in infrastructure/docker/.env}:${TB_KEYCLOAK_PORT:?Set TB_KEYCLOAK_PORT in infrastructure/docker/.env}:8080"
    depends_on:
      portal-db:
        condition: service_healthy
    volumes:
      - ../keycloak/teman-belajar-realm.json:/opt/keycloak/data/import/teman-belajar-realm.json:ro
      - ../keycloak/reconcile-sso-clients.sh:/opt/keycloak/data/import/reconcile-sso-clients.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      com.teman-belajar.component: keycloak

  minio:
    image: minio/minio:RELEASE.2023-08-09T23-30-22Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TB_MINIO_ROOT_USER:?Set TB_MINIO_ROOT_USER in infrastructure/docker/.env}
      MINIO_ROOT_PASSWORD: ${TB_MINIO_ROOT_PASSWORD:?Set TB_MINIO_ROOT_PASSWORD in infrastructure/docker/.env}
    ports:
      - "${TB_BIND_ADDRESS:?Set TB_BIND_ADDRESS in infrastructure/docker/.env}:${TB_MINIO_API_PORT:?Set TB_MINIO_API_PORT in infrastructure/docker/.env}:9000"
      - "${TB_BIND_ADDRESS:?Set TB_BIND_ADDRESS in infrastructure/docker/.env}:${TB_MINIO_CONSOLE_PORT:?Set TB_MINIO_CONSOLE_PORT in infrastructure/docker/.env}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      com.teman-belajar.component: minio

  search:
    image: getmeili/meilisearch:v1.6.2
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${TB_MEILI_MASTER_KEY:?Set TB_MEILI_MASTER_KEY in infrastructure/docker/.env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: ${TB_MEILI_ENV:?Set TB_MEILI_ENV in infrastructure/docker/.env}
    ports:
      - "${TB_BIND_ADDRESS:?Set TB_BIND_ADDRESS in infrastructure/docker/.env}:${TB_MEILI_PORT:?Set TB_MEILI_PORT in infrastructure/docker/.env}:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      com.teman-belajar.component: search

  moodle:
    image: teman-belajar-moodle:local
    build:
      context: ./moodle
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MOODLE_DATABASE_HOST: moodle-db
      MOODLE_DATABASE_NAME: ${TB_MOODLE_DB_NAME:?Set TB_MOODLE_DB_NAME in infrastructure/docker/.env}
      MOODLE_DATABASE_USER: ${TB_MOODLE_DB_USER:?Set TB_MOODLE_DB_USER in infrastructure/docker/.env}
      MOODLE_DATABASE_PASSWORD: ${TB_MOODLE_DB_PASSWORD:?Set TB_MOODLE_DB_PASSWORD in infrastructure/docker/.env}
      MOODLE_BASE_URL: ${TB_MOODLE_URL:?Set TB_MOODLE_URL in infrastructure/docker/.env}
      MOODLE_KEYCLOAK_ISSUER: ${TB_KEYCLOAK_URL:?Set TB_KEYCLOAK_URL in infrastructure/docker/.env}/realms/teman-belajar
      MOODLE_POST_LOGOUT_REDIRECT_URL: ${TB_WEB_URL:?Set TB_WEB_URL in infrastructure/docker/.env}
      MOODLE_ADMIN_USER: ${TB_MOODLE_ADMIN_USER:?Set TB_MOODLE_ADMIN_USER in infrastructure/docker/.env}
      MOODLE_ADMIN_PASSWORD: ${TB_MOODLE_ADMIN_PASSWORD:?Set TB_MOODLE_ADMIN_PASSWORD in infrastructure/docker/.env}
      MOODLE_ADMIN_EMAIL: ${TB_MOODLE_ADMIN_EMAIL:?Set TB_MOODLE_ADMIN_EMAIL in infrastructure/docker/.env}
      MOODLE_ALLOW_INSECURE_OAUTH2: ${TB_MOODLE_ALLOW_INSECURE_OAUTH2:?Set TB_MOODLE_ALLOW_INSECURE_OAUTH2 in infrastructure/docker/.env}
    ports:
      - "${TB_BIND_ADDRESS:?Set TB_BIND_ADDRESS in infrastructure/docker/.env}:${TB_MOODLE_PORT:?Set TB_MOODLE_PORT in infrastructure/docker/.env}:80"
    extra_hosts:
      - keycloak.teman-belajar.localhost:host-gateway
    depends_on:
      moodle-db:
        condition: service_healthy
    volumes:
      - moodle-app-data:/var/www/html
      - moodle-data:/var/www/moodledata
      - ../../integrations/moodle-plugin/local_temanbelajar:/var/www/html/public/local/temanbelajar:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    labels:
      com.teman-belajar.component: moodle

  moodle-cron:
    image: teman-belajar-moodle:local
    build:
      context: ./moodle
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      bash -c "while true; do sudo -u www-data php /var/www/html/admin/cli/cron.php; sleep 60; done"
    environment:
      MOODLE_DATABASE_HOST: moodle-db
      MOODLE_DATABASE_NAME: ${TB_MOODLE_DB_NAME:?Set TB_MOODLE_DB_NAME in infrastructure/docker/.env}
      MOODLE_DATABASE_USER: ${TB_MOODLE_DB_USER:?Set TB_MOODLE_DB_USER in infrastructure/docker/.env}
      MOODLE_DATABASE_PASSWORD: ${TB_MOODLE_DB_PASSWORD:?Set TB_MOODLE_DB_PASSWORD in infrastructure/docker/.env}
      MOODLE_BASE_URL: ${TB_MOODLE_URL:?Set TB_MOODLE_URL in infrastructure/docker/.env}
      MOODLE_KEYCLOAK_ISSUER: ${TB_KEYCLOAK_URL:?Set TB_KEYCLOAK_URL in infrastructure/docker/.env}/realms/teman-belajar
      MOODLE_POST_LOGOUT_REDIRECT_URL: ${TB_WEB_URL:?Set TB_WEB_URL in infrastructure/docker/.env}
      MOODLE_ADMIN_USER: ${TB_MOODLE_ADMIN_USER:?Set TB_MOODLE_ADMIN_USER in infrastructure/docker/.env}
      MOODLE_ADMIN_PASSWORD: ${TB_MOODLE_ADMIN_PASSWORD:?Set TB_MOODLE_ADMIN_PASSWORD in infrastructure/docker/.env}
      MOODLE_ADMIN_EMAIL: ${TB_MOODLE_ADMIN_EMAIL:?Set TB_MOODLE_ADMIN_EMAIL in infrastructure/docker/.env}
      MOODLE_ALLOW_INSECURE_OAUTH2: ${TB_MOODLE_ALLOW_INSECURE_OAUTH2:?Set TB_MOODLE_ALLOW_INSECURE_OAUTH2 in infrastructure/docker/.env}
    extra_hosts:
      - keycloak.teman-belajar.localhost:host-gateway
    depends_on:
      moodle-db:
        condition: service_healthy
      moodle:
        condition: service_healthy
    volumes:
      - moodle-app-data:/var/www/html
      - moodle-data:/var/www/moodledata
      - ../../integrations/moodle-plugin/local_temanbelajar:/var/www/html/public/local/temanbelajar:ro
    labels:
      com.teman-belajar.component: moodle-cron

  migrate:
    image: teman-belajar-api:local
    build:
      context: ../../services/portal-api
      dockerfile: Dockerfile
    restart: "no"
    command: ["./portal-migrate"]
    environment:
      DATABASE_URL: postgres://${TB_PORTAL_DB_USER:?Set TB_PORTAL_DB_USER in infrastructure/docker/.env}:${TB_PORTAL_DB_PASSWORD:?Set TB_PORTAL_DB_PASSWORD in infrastructure/docker/.env}@portal-db:5432/${TB_PORTAL_DB_NAME:?Set TB_PORTAL_DB_NAME in infrastructure/docker/.env}?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      portal-db:
        condition: service_healthy
    labels:
      com.teman-belajar.component: migrate

  api:
    image: teman-belajar-api:local
    build:
      context: ../../services/portal-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${TB_PORTAL_DB_USER:?Set TB_PORTAL_DB_USER in infrastructure/docker/.env}:${TB_PORTAL_DB_PASSWORD:?Set TB_PORTAL_DB_PASSWORD in infrastructure/docker/.env}@portal-db:5432/${TB_PORTAL_DB_NAME:?Set TB_PORTAL_DB_NAME in infrastructure/docker/.env}?sslmode=disable
      REDIS_URL: redis://:${TB_REDIS_PASSWORD:?Set TB_REDIS_PASSWORD in infrastructure/docker/.env}@redis:6379/0
      KEYCLOAK_ISSUER_URL: ${TB_KEYCLOAK_URL:?Set TB_KEYCLOAK_URL in infrastructure/docker/.env}/realms/teman-belajar
      KEYCLOAK_AUDIENCE: teman-belajar-api
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${TB_MINIO_ROOT_USER:?Set TB_MINIO_ROOT_USER in infrastructure/docker/.env}
      MINIO_SECRET_KEY: ${TB_MINIO_ROOT_PASSWORD:?Set TB_MINIO_ROOT_PASSWORD in infrastructure/docker/.env}
      MINIO_BUCKET: teman-belajar-media
      MINIO_USE_SSL: "false"
      MEDIA_MAX_UPLOAD_BYTES: "20971520"
      TB_MOODLE_WEBSERVICE_TOKEN: ${TB_MOODLE_WEBSERVICE_TOKEN}
      MOODLE_INTERNAL_BASE_URL: http://moodle
      MOODLE_PUBLIC_BASE_URL: ${TB_MOODLE_URL:?Set TB_MOODLE_URL in infrastructure/docker/.env}
      MEILI_URL: http://search:7700
      MEILI_SEARCH_KEY: ${TB_MEILI_MASTER_KEY:?Set TB_MEILI_MASTER_KEY in infrastructure/docker/.env}
      MEILI_INDEX_NAME: ${TB_MEILI_INDEX_NAME:?Set TB_MEILI_INDEX_NAME in infrastructure/docker/.env}
      SEARCH_CAPTURE_RAW_QUERY: ${TB_SEARCH_CAPTURE_RAW_QUERY:?Set TB_SEARCH_CAPTURE_RAW_QUERY in infrastructure/docker/.env}
    extra_hosts:
      - keycloak.teman-belajar.localhost:host-gateway
    ports:
      - "${TB_BIND_ADDRESS:?Set TB_BIND_ADDRESS in infrastructure/docker/.env}:${TB_API_PORT:?Set TB_API_PORT in infrastructure/docker/.env}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      com.teman-belajar.component: api
      com.teman-belajar.service-name: teman-belajar-api

  search-worker:
    image: teman-belajar-search-worker:local
    build:
      context: ../../services/portal-api
      dockerfile: Dockerfile.search-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${TB_PORTAL_DB_USER:?Set TB_PORTAL_DB_USER in infrastructure/docker/.env}:${TB_PORTAL_DB_PASSWORD:?Set TB_PORTAL_DB_PASSWORD in infrastructure/docker/.env}@portal-db:5432/${TB_PORTAL_DB_NAME:?Set TB_PORTAL_DB_NAME in infrastructure/docker/.env}?sslmode=disable
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${TB_MEILI_MASTER_KEY:?Set TB_MEILI_MASTER_KEY in infrastructure/docker/.env}
      MEILI_INDEX_NAME: ${TB_MEILI_INDEX_NAME:?Set TB_MEILI_INDEX_NAME in infrastructure/docker/.env}
      MOODLE_INTERNAL_BASE_URL: http://moodle
      MOODLE_PUBLIC_BASE_URL: ${TB_MOODLE_URL:?Set TB_MOODLE_URL in infrastructure/docker/.env}
      TB_MOODLE_WEBSERVICE_TOKEN: ${TB_MOODLE_WEBSERVICE_TOKEN:?Set TB_MOODLE_WEBSERVICE_TOKEN in infrastructure/docker/.env}
      SYNC_INTERVAL: 60s
    depends_on:
      portal-db:
        condition: service_healthy
      search:
        condition: service_healthy
      moodle:
        condition: service_healthy
    labels:
      com.teman-belajar.component: search-worker

  web:
    image: teman-belajar-web:local
    build:
      context: ../../apps/portal-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: ${TB_WEB_URL:?Set TB_WEB_URL in infrastructure/docker/.env}
      NEXTAUTH_SECRET: ${TB_WEB_NEXTAUTH_SECRET:?Set TB_WEB_NEXTAUTH_SECRET in infrastructure/docker/.env}
      KEYCLOAK_ID: teman-belajar-web
      KEYCLOAK_SECRET: ${TB_KEYCLOAK_WEB_CLIENT_SECRET:?Set TB_KEYCLOAK_WEB_CLIENT_SECRET in infrastructure/docker/.env}
      KEYCLOAK_ISSUER: ${TB_KEYCLOAK_URL:?Set TB_KEYCLOAK_URL in infrastructure/docker/.env}/realms/teman-belajar
      POST_LOGOUT_REDIRECT_URL: ${TB_WEB_URL:?Set TB_WEB_URL in infrastructure/docker/.env}
      PORTAL_API_INTERNAL_URL: http://api:8080
      MOODLE_PUBLIC_BASE_URL: ${TB_MOODLE_URL:?Set TB_MOODLE_URL in infrastructure/docker/.env}
    extra_hosts:
      - keycloak.teman-belajar.localhost:host-gateway
    ports:
      - "${TB_BIND_ADDRESS:?Set TB_BIND_ADDRESS in infrastructure/docker/.env}:${TB_WEB_PORT:?Set TB_WEB_PORT in infrastructure/docker/.env}:3000"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$(hostname):3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      com.teman-belajar.component: web
      com.teman-belajar.service-name: teman-belajar-web

  admin:
    image: teman-belajar-admin:local
    build:
      context: ../../apps/admin-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: ${TB_ADMIN_URL:?Set TB_ADMIN_URL in infrastructure/docker/.env}
      NEXTAUTH_SECRET: ${TB_ADMIN_NEXTAUTH_SECRET:?Set TB_ADMIN_NEXTAUTH_SECRET in infrastructure/docker/.env}
      KEYCLOAK_ID: teman-belajar-admin
      KEYCLOAK_SECRET: ${TB_KEYCLOAK_ADMIN_CLIENT_SECRET:?Set TB_KEYCLOAK_ADMIN_CLIENT_SECRET in infrastructure/docker/.env}
      KEYCLOAK_ISSUER: ${TB_KEYCLOAK_URL:?Set TB_KEYCLOAK_URL in infrastructure/docker/.env}/realms/teman-belajar
      POST_LOGOUT_REDIRECT_URL: ${TB_WEB_URL:?Set TB_WEB_URL in infrastructure/docker/.env}
      PORTAL_API_INTERNAL_URL: http://api:8080
    extra_hosts:
      - keycloak.teman-belajar.localhost:host-gateway
    ports:
      - "${TB_BIND_ADDRESS:?Set TB_BIND_ADDRESS in infrastructure/docker/.env}:${TB_ADMIN_PORT:?Set TB_ADMIN_PORT in infrastructure/docker/.env}:3000"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$(hostname):3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      com.teman-belajar.component: admin
      com.teman-belajar.service-name: teman-belajar-admin

networks:
  default:
    name: teman-belajar-network

volumes:
  portal-db-data:
    name: teman-belajar-portal-db-data
  meili-data:
    name: teman-belajar-meili-data
  moodle-db-data:
    name: teman-belajar-moodle-db-data
  redis-data:
    name: teman-belajar-redis-data
  minio-data:
    name: teman-belajar-minio-data
  moodle-app-data:
    name: teman-belajar-moodle-app-data
  moodle-data:
    name: teman-belajar-moodle-data
