name: CI Baseline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Go Build
      working-directory: services/portal-api
      run: go build -v ./...

    - name: Go Test
      working-directory: services/portal-api
      run: go test -v ./...

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    # Skipping frontend linting if no package.json exists yet for CI
    # Will add proper linting commands later
