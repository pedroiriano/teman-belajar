name: CI Baseline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify agent governance alignment
        shell: pwsh
        run: ./scripts/verify-agent-governance.ps1
      - name: Verify production readiness governance
        shell: pwsh
        run: ./scripts/verify-production-readiness.ps1

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: teman_belajar_portal
          POSTGRES_PASSWORD: secret123456_PORTAL_DB_PASSWORD
          POSTGRES_DB: teman_belajar
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://teman_belajar_portal:secret123456_PORTAL_DB_PASSWORD@localhost:15432/teman_belajar?sslmode=disable
      DATABASE_URL: postgres://teman_belajar_portal:secret123456_PORTAL_DB_PASSWORD@localhost:15432/teman_belajar?sslmode=disable
      MIGRATIONS_DIR: "./migrations"
      TASK011_REQUIRE_INTEGRATION_DB: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/portal-api/go.mod
          cache-dependency-path: services/portal-api/go.sum
      - name: Build
        working-directory: services/portal-api
        run: go build ./...
      - name: Run Migrations
        working-directory: services/portal-api
        run: go run ./cmd/migrate
      - name: Test
        working-directory: services/portal-api
        run: go test -v ./...
      - name: Vet
        working-directory: services/portal-api
        run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [apps/portal-web, apps/admin-web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint
      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: npm run typecheck
      - name: Admin UI contract tests
        if: matrix.app == 'apps/admin-web'
        working-directory: apps/admin-web
        run: npm run test:theme && npm run test:no-orange && npm run test:media && npm run test:drafts && npm run test:hierarchy
      - name: Portal Knowledge explorer contract test
        if: matrix.app == 'apps/portal-web'
        working-directory: apps/portal-web
        run: npm run test:hierarchy
      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.7.0 lint openapi/openapi.yaml
