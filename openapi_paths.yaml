  /api/v1/learning/courses:
    get:
      tags:
        - Learning
      summary: List available courses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LearningCourse'
  /api/v1/learning/me:
    get:
      tags:
        - Learning
      summary: Get current mapped learning user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Learning User
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LearningUser'
  /api/v1/learning/me/courses:
    get:
      tags:
        - Learning
      summary: Get enrolled courses for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enrolled courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnrolledCourse'
  /api/v1/learning/me/courses/{courseId}/completion:
    get:
      tags:
        - Learning
      summary: Get course completion status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Course completion status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CourseCompletion'
  /api/v1/learning/me/courses/{courseId}/grades:
    get:
      tags:
        - Learning
      summary: Get user grades for a course
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User course grades
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GradeItem'
